<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Food On Wheels | Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo">FW</span><span><b>FOOD</b><small>ON WHEELS</small></span></div>
  <span class="open"><i></i> OPEN</span>
</div>

<section class="hero">
  <div class="hero-copy">
    <div class="eyebrow">🔥 FRESH. HOT. MADE FOR YOU.</div>
    <h1>What are you<br><em>craving today?</em></h1>
    <p>Delicious meals · Fast service · Made with love</p>
    <button class="start" onclick="document.getElementById('menuStart').scrollIntoView({behavior:'smooth'})">Start Ordering <span>→</span></button>
    <div class="rating">⭐ <b>4.8</b> · Loved by 500+ customers</div>
  </div>
</section>

<div class="type-switch">
  <button class="type active" data-type="dining"><span>🍽️</span><b>Dining</b><small>Enjoy at our place</small></button>
  <button class="type" data-type="parcel"><span>🛍️</span><b>Parcel</b><small>Take it with you</small></button>
</div>

<main id="menuStart">
  <div class="section-head">
    <div><label>EXPLORE</label><h2>Choose your favourites</h2></div>
    <span class="fast">⚡ FAST ORDER</span>
  </div>

  <nav id="categories" class="chips"></nav>
  <div id="menu"></div>
</main>

<div id="cartBar" class="cart-bar" hidden>
  <div class="cart-icon">🛍️<b id="cartCount">0</b></div>
  <div class="cart-info"><strong id="cartItemsCount">0 items</strong><small>View your cart</small></div>
  <strong class="cart-price">₹<span id="cartTotal">0</span></strong>
  <button onclick="openCart()">View Cart <span>→</span></button>
</div>

<div id="cartModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><div><label>YOUR ORDER</label><h2>Your Cart</h2></div><button onclick="closeCart()">✕</button></div>
    <div id="cartItems"></div>
    <div class="totals">
      <div><span>Food total</span><b>₹<span id="foodTotal">0</span></b></div>
      <div id="parcelLine" hidden><span>Parcel charge</span><b>₹10</b></div>
      <div class="grand"><span>Total</span><b>₹<span id="modalTotal">0</span></b></div>
    </div>
    <textarea id="notesInput" placeholder="Special instructions (optional)"></textarea>
    <button id="whatsappButton" class="whatsapp">Send Order on WhatsApp <span>→</span></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
